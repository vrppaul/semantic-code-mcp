name: Publish to PyPI

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  # The whole CI suite must pass on the tagged commit before anything reaches
  # PyPI: a published version can never be replaced
  ci:
    uses: ./.github/workflows/ci.yml

  # The suite ran on the lock; a user's `uvx` takes the newest versions within the
  # bounds instead. A release ships only a lock a fresh resolve would leave as it is,
  # so what the suite and the harness ran on is what users install (ADR 006, D14):
  # move the lock (`uv lock --upgrade`) and run everything on it before tagging
  fresh-lock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
      - run: uv lock --upgrade
      - run: git diff --exit-code uv.lock

  publish:
    name: Build and publish
    needs: [ci, fresh-lock]
    runs-on: ubuntu-latest
    permissions:
      id-token: write # PyPI trusted publishing (OIDC)
      contents: write # the GitHub Release
    # A required reviewer on this environment makes the owner approve each release
    # here; it is a repository setting (Settings → Environments → pypi)
    environment: pypi

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0 # hatch-vcs reads the version from the tags

      - uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2

      - name: Build package
        run: uv build

      # --check-url makes a re-run safe: files already on PyPI are skipped
      # instead of failing on its duplicate-filename rejection
      - name: Publish to PyPI
        run: uv publish --trusted-publishing always --check-url https://pypi.org/simple/

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" dist/* --generate-notes
