name: Speed

# What a user waits for on each system the README promises, on a repository of Sentry's shape
# made on the runner (evals/generated/): the files followed by the system's watcher, then scanned
# at each search, one run beside the other (ADR 010, O1). Figures in the log, no gate: a runner's
# speed moves from run to run, and `evals/targets.py` holds the owner's machine alone.
on:
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  speed:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
      - run: uv sync
      # The corpus is made and committed by the first run, and reused by the second
      - name: files followed by the system's watcher
        run: uv run python -m evals speed --corpus-file evals/generated/sentry-shaped.toml --words-only
      - name: files scanned at each search
        run: >-
          uv run python -m evals speed --corpus-file evals/generated/sentry-shaped.toml
          --words-only --scan
