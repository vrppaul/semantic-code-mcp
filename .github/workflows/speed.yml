name: Speed

# What a user waits for on each system the README promises, on a repository of Sentry's shape
# made on the runner (evals/generated/): the files followed by the system's watcher, then scanned
# at each search, one run beside the other (ADR 010, O1). Figures in the log, no gate: a runner's
# speed moves from run to run, and `evals/targets.py` holds the owner's machine alone. Run by
# hand, as a change of a watcher asks, some 15 minutes of three runners: from Actions once the
# workflow is on master, and before that by a pull request that names `pull_request` here again
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  speed:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
      - run: uv sync
      # In alternating turns, two each, as speeds are compared here: the corpus is made and
      # committed by the first run, and a runner may still be reading what was made, as
      # Windows' scanner of new files does, when it is timed
      - name: files followed by the system's watcher, first turn
        run: uv run python -m evals speed --corpus-file evals/generated/sentry-shaped.toml --words-only
      - name: files scanned at each search, first turn
        run: >-
          uv run python -m evals speed --corpus-file evals/generated/sentry-shaped.toml
          --words-only --scan
      - name: files followed by the system's watcher, second turn
        run: uv run python -m evals speed --corpus-file evals/generated/sentry-shaped.toml --words-only
      - name: files scanned at each search, second turn
        run: >-
          uv run python -m evals speed --corpus-file evals/generated/sentry-shaped.toml
          --words-only --scan
