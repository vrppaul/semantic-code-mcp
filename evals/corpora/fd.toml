# sharkdp/fd: a small Rust command-line tool
[corpus]
name = "fd"
repository = "https://github.com/sharkdp/fd.git"
commit = "c44735ec0f130c2486afe9c976937c03b57a8c62"

[[queries]]
text = "parse a size filter such as +10k or -1M"
answers = [{ path = "src/filter/size.rs", symbol = "from_string" }]

[[queries]]
text = "filter files changed before or after a date"
answers = [
  { path = "src/filter/time.rs", symbol = "TimeFilter" },
  { path = "src/filter/time.rs", symbol = "applies_to" },
]

[[queries]]
text = "run a command for every search result"
answers = [
  { path = "src/exec/job.rs", symbol = "job" },
  # Added after a run, rightly: runs the command set on one result
  { path = "src/exec/mod.rs", symbol = "execute" },
]

[[queries]]
text = "run one command with all the results as its arguments"
answers = [
  { path = "src/exec/job.rs", symbol = "batch" },
  # Added after a run, rightly: runs the command once with every result as arguments.
  # `new_batch`, added with it, only builds the command set and runs nothing: not an answer
  { path = "src/exec/mod.rs", symbol = "execute_batch" },
]

[[queries]]
text = "walk directories in parallel and collect the matching entries"
answers = [{ path = "src/walk.rs", symbol = "scan" }]

[[queries]]
text = "print a path in color"
answers = [{ path = "src/output.rs", symbol = "print_entry_colorized" }]

[[queries]]
text = "check whether a file or directory is empty"
answers = [{ path = "src/filesystem.rs", symbol = "is_empty" }]

[[queries]]
text = "decide whether an entry has one of the requested file types"
answers = [{ path = "src/filetypes.rs", symbol = "should_ignore" }]

[[queries]]
text = "combine the exit codes of several commands into one"
answers = [{ path = "src/exit_codes.rs", symbol = "merge_exitcodes" }]

[[queries]]
text = "parse placeholders like {} and {/} in a command template"
answers = [{ path = "src/fmt/mod.rs", symbol = "parse" }]

[[queries]]
text = "filter files by the user and group that own them"
answers = [
  { path = "src/filter/owner.rs", symbol = "OwnerFilter" },
  { path = "src/filter/owner.rs", symbol = "matches" },
]

[[queries]]
text = "turn a path into a file URL for terminal hyperlinks"
answers = [
  { path = "src/hyperlink.rs", symbol = "PathUrl" },
  { path = "src/hyperlink.rs", symbol = "Display for PathUrl" },
  # Added after a run: `new` turns the path into the absolute one the URL holds, and
  # `encode` percent-encodes each byte of it as `Display` writes the URL
  { path = "src/hyperlink.rs", symbol = "new" },
  { path = "src/hyperlink.rs", symbol = "encode" },
]

[[queries]]
text = "escape control characters before printing a file name to the terminal"
answers = [
  { path = "src/sanitize.rs", symbol = "sanitize_for_term" },
  { path = "src/sanitize.rs", symbol = "write_sanitized" },
]

[[queries]]
text = "check if a regex pattern has an uppercase letter to choose case sensitivity"
answers = [{ path = "src/regex_helper.rs", symbol = "pattern_has_uppercase_char" }]

[[queries]]
text = "strip the leading ./ from a path"
answers = [{ path = "src/filesystem.rs", symbol = "strip_current_dir" }]

# Questions whose answer is the documentation, so the harness weighs prose against code

[[queries]]
text = "make the search include hidden files and the files gitignore excludes"
answers = [{ path = "README.md", symbol = "Hidden and ignored files" }]

[[queries]]
text = "remove every file and directory that a search matches"
answers = [{ path = "README.md", symbol = "Deleting files" }]

[[queries]]
text = "the steps of publishing a new release"
answers = [
  { path = "doc/release-checklist.md", symbol = "Release checklist" },
  { path = "doc/release-checklist.md", symbol = "Version bump" },
  { path = "doc/release-checklist.md", symbol = "Pre-release checks and updates" },
  { path = "doc/release-checklist.md", symbol = "Release" },
]

[[queries]]
text = "where to report a security vulnerability privately"
answers = [
