# A repository of Sentry's shape, made where none so large can be cloned, as on CI's runners:
# 8,500 modules in 3,054 directories, Sentry's 8,546 files in 3,129. Its modules are small and
# alike, so its first index is no measure of a real one's; a stale check's, a watcher's start
# and a search's cost are, as they go by files and directories. Asked by a speed run alone:
#
#     uv run python -m evals speed --corpus-file evals/generated/sentry-shaped.toml --words-only
# No question is held out: none of its rankings is ever chosen by
held_out = []

[corpus]
name = "sentry-shaped"
modules = 8500
modules_per_directory = 3
directories_per_directory = 14

[[queries]]
kind = "code"
text = "settle what one invoice owes in module 0"
answers = [{ path = "package_00/package_00/package_00/package_00/module_00000.py", symbol = "settle_invoice_0" }]

