[project]
name = "semantic-code-mcp"
dynamic = ["version"]
description = "Local MCP server for semantic code search"
readme = "README.md"
requires-python = ">=3.14"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Pavel Paranin" }]
dependencies = [
    "lancedb>=0.27.0",
    "mcp>=1.26.0,<2",
    "pandas>=3.0.0",
    "pyarrow>=23.0.0",
    "pydantic>=2.12.5",
    "pydantic-settings>=2.12.0",
    "sentence-transformers>=5.2.0",
    "structlog>=25.5.0",
    "torch>=2.10.0",
    "tree-sitter>=0.25.2",
    "tree-sitter-markdown>=0.5.1",
    "tree-sitter-python>=0.25.0",
    "tree-sitter-rust>=0.24.0",
]

[project.urls]
Homepage = "https://github.com/vrppaul/semantic-code-mcp"
Issues = "https://github.com/vrppaul/semantic-code-mcp/issues"
Changelog = "https://github.com/vrppaul/semantic-code-mcp/blob/master/CHANGELOG.md"

[project.scripts]
semantic-code-mcp = "semantic_code_mcp.cli:main"

[tool.uv.sources]
torch = [{ index = "pytorch-cpu" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[tool.hatch.version]
source = "vcs"
fallback-version = "0.0.0"

[tool.hatch.build.targets.wheel]
packages = ["src/semantic_code_mcp"]

[dependency-groups]
dev = [
    "deptry>=0.25.1",
    "pre-commit>=4.5.1",
    "pyinstrument>=5.1.2",
    "pytest>=9.0.2",
    "pytest-asyncio>=1.3.0",
    "ruff>=0.14.14",
    "ty>=0.0.13",
    "typos>=1.51.1",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
target-version = "py314"
line-length = 100
src = ["src"]
fix = true
exclude = [
    ".git",
    ".venv",
    "__pycache__",
    "*.pyc",
    "build",
    "dist",
    # Taken whole from claude-review and held to its ruff settings there
    # (.claude/rules/scripts.md): formatting it here would part the two copies
    "scripts/check_instruction_files.py",
]
force-exclude = true

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
docstring-code-format = true

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "F",      # pyflakes
    "I",      # isort
    "UP",     # pyupgrade
    "B",      # flake8-bugbear
    "C4",     # flake8-comprehensions
    "C901",   # mccabe complexity
    "N",      # pep8-naming
    "SIM",    # flake8-simplify
    "TID",    # tidy imports (banned relative imports, etc.)
    "W",      # pycodestyle warnings
    "RUF",    # Ruff-specific rules
    "DTZ",    # datetime timezone safety
    "ASYNC",  # async anti-patterns (blocking calls in async)
    "SLF",    # private member access from outside class
    "PIE",    # misc. lints (unnecessary pass, dict merge, etc.)
    "T20",    # no print() in source (use structlog)
    "RSE",    # unnecessary parens on raise
    # "TCH" omitted — too aggressive, flags Path and other runtime imports
    "PERF",   # performance anti-patterns
    "FURB",   # refurb modernizations
    "PLC0415",  # import-outside-toplevel
]
ignore = [
    "E712",    # == True comparisons (sometimes needed for SQL expressions)
    "SIM108",  # ternary operator — if/else often more readable
    "SIM103",  # return condition directly — explicit if/return often more readable
    "PERF203", # try/except in loop — often necessary, not always avoidable
    "FURB140", # Use itertools.starmap — less readable than comprehensions
]

[tool.ruff.lint.mccabe]
max-complexity = 12

[tool.ruff.lint.isort]
combine-as-imports = true
known-first-party = ["semantic_code_mcp"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
"tests/**/*.py" = ["SLF001", "T20", "DTZ", "PLC0415"]
# A command-line report: printing the report is its job
"evals/__main__.py" = ["T20"]

[tool.ty.environment]
python-version = "3.14"

[tool.ty.src]
# The tests are held to ruff; no type check reads them
exclude = ["tests"]

[tool.ty.terminal]
# A warning is a finding like any other: it fails the check, in a hook and in CI alike
error-on-warning = true

[tool.deptry.per_rule_ignores]
DEP002 = [
    # sentence-transformers imports it; declared to pin it to the CPU-only index
    "torch",
    # LanceDB's to_pandas() needs it; it leaves with to_pandas() (ADR 006, D4)
    "pandas",
]
# Dev-only profiling, imported only when SEMANTIC_CODE_MCP_PROFILE is set
DEP004 = ["pyinstrument"]

[tool.typos.default.extend-identifiers]
NDArray = "NDArray"

[tool.typos.files]
# The tests hold deliberate misspellings and foreign words as test data
extend-exclude = ["tests/"]

[tool.bandit]
exclude_dirs = ["tests", ".venv"]
