[project]
name = "semantic-code-mcp"
dynamic = ["version"]
description = "Local MCP server for semantic code search"
readme = "README.md"
requires-python = ">=3.14"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Pavel Paranin" }]
dependencies = [
    "filelock>=3.20.3,<4",
    "huggingface-hub>=2.3.0,<3",
    "lancedb==0.30.2",
    "mcp>=2.3.0,<3",
    "numpy>=2.4.1,<3",
    "onnxruntime>=1.31.1,<2",
    "pyarrow>=23.0.0,<24",
    "pydantic>=2.12.5,<3",
    "pydantic-settings>=2.12.0,<3",
    "pylance>=4.0.2,<4.1",
    "structlog>=26.1.0,<27",
    "tokenizers>=0.23.3,<0.24",
    "tree-sitter>=0.25.2,<0.26",
    "tree-sitter-markdown>=0.5.1,<0.6",
    "tree-sitter-python>=0.25.0,<0.26",
    "tree-sitter-rust>=0.24.0,<0.25",
]

[project.urls]
Homepage = "https://github.com/vrppaul/semantic-code-mcp"
Issues = "https://github.com/vrppaul/semantic-code-mcp/issues"
Changelog = "https://github.com/vrppaul/semantic-code-mcp/blob/master/CHANGELOG.md"

[project.scripts]
semantic-code-mcp = "semantic_code_mcp.cli:main"

[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[tool.hatch.version]
source = "vcs"
fallback-version = "0.0.0"

[tool.hatch.build.targets.wheel]
packages = ["src/semantic_code_mcp"]

[dependency-groups]
dev = [
    "deptry>=0.25.1",
    "hypothesis>=6.170.11",
    "import-linter>=2.15",
    "onnx>=1.23.2",
    "pre-commit>=4.5.1",
    "pyinstrument>=5.1.2",
    "pytest>=9.0.2",
    "pytest-asyncio>=1.3.0",
    "ruff>=0.14.14",
    "ty>=0.0.13",
    "typos>=1.51.1",
    "vulture>=2.16",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
target-version = "py314"
line-length = 100
src = ["src"]
fix = true
exclude = [
    ".git",
    ".venv",
    "__pycache__",
    "*.pyc",
    "build",
    "dist",
    # Taken whole from claude-review and held to its ruff settings there
    # (.claude/rules/scripts.md): formatting it here would part the two copies
    "scripts/check_instruction_files.py",
]
force-exclude = true

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
docstring-code-format = true

[tool.ruff.lint]
select = [
    "E",        # pycodestyle errors
    "F",        # pyflakes
    "I",        # isort
    "UP",       # pyupgrade
    "B",        # flake8-bugbear
    "C4",       # flake8-comprehensions
    "C90",      # no function too tangled to follow
    "N",        # pep8-naming
    "SIM",      # flake8-simplify
    "TID",      # tidy imports, banned APIs among them
    "W",        # pycodestyle warnings
    "RUF",      # Ruff-specific rules
    "DTZ",      # no naive datetimes
    "ASYNC",    # async anti-patterns
    "SLF",      # nothing reaches into another object's private members
    "PIE",      # unnecessary pass, spreads and the like
    "T20",      # no print() in source (use structlog)
    "RSE",      # unnecessary parens on raise
    "PERF",     # performance anti-patterns
    "FURB",     # refurb modernizations
    "PLC",      # pylint conventions (import-outside-toplevel among them)
    "PLE",      # pylint errors
    "PLW",      # pylint warnings
    "A",        # nothing shadows a builtin
    "ANN",      # every function says what it takes and gives
    "BLE",      # no blind `except Exception`
    "EM",       # an exception's message is named before it is raised
    "ERA",      # no commented-out code
    "G",        # logging calls take fields, not formatted strings
    "INP",      # no implicit namespace packages
    "ISC",      # no implicit string concatenation
    "LOG",      # logging used as meant
    "PGH",      # no blanket noqa or type: ignore
    "PT",       # pytest used as meant
    "PTH",      # pathlib over os.path
    "RET",      # returns that say what they return
    "TRY",      # exceptions raised and caught as meant
    "FBT",      # no bare True or False whose meaning only the signature knows
    "ARG",      # every parameter used
    "PLR0913",  # no function asking for more than five things
    "PLR2004",  # no number or string in a comparison without a name
]
ignore = [
    "SIM108",  # ternary operator — if/else often more readable
]

[tool.ruff.lint.pylint]
# A string compared outright is as unnamed as a number
allow-magic-value-types = []

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"typing.Any".msg = "Name the shape: a model, an interface or a type of its own."
"typing.Protocol".msg = "An interface its implementations inherit is an abstract class: abc.ABC, every member @abstractmethod."
"typing.cast".msg = "Prove the type instead: narrow it, or validate it with a model."

[tool.ruff.lint.mccabe]
max-complexity = 12

[tool.ruff.lint.isort]
combine-as-imports = true
known-first-party = ["semantic_code_mcp"]

[tool.ruff.lint.per-file-ignores]
# The tests are held to formatting and to what keeps them readable; the rules for
# shipped code (annotations, named values, booleans, argument counts) are not theirs
"tests/**/*.py" = ["ANN", "PLR2004", "FBT", "PLR0913", "ARG", "SLF001", "T20", "DTZ", "PLC0415", "INP001"]
# A command-line report: printing the report is its job
"evals/__main__.py" = ["T20"]
# Scripts are run by path, not imported from a package, and what they find is their
# output, printed as a linter prints its findings
"scripts/**" = ["T20", "INP001"]

[tool.ty.environment]
python-version = "3.14"

[tool.ty.src]
# The tests are held to ruff; no type check reads them
exclude = ["tests"]

[tool.ty.terminal]
# A warning is a finding like any other: it fails the check, in a hook and in CI alike
error-on-warning = true

[tool.deptry.per_rule_ignores]
# Dev-only profiling, imported only when SEMANTIC_CODE_MCP_PROFILE is set
DEP004 = ["pyinstrument"]

[tool.typos.default.extend-identifiers]
NDArray = "NDArray"

[tool.typos.files]
# The tests hold deliberate misspellings and foreign words as test data
extend-exclude = ["tests/"]

[tool.bandit]
exclude_dirs = ["tests", ".venv"]

[tool.importlinter]
root_package = "semantic_code_mcp"
# The packages it imports are part of the graph, so a contract can forbid one
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Each layer builds only on the layers after it"
type = "layers"
# The entry points start the server; the server's tools hand work to the services;
# the services use the parts; the parts share the domain and the settings
layers = [
    "semantic_code_mcp.__main__",
    "semantic_code_mcp.cli",
    "semantic_code_mcp.app",
    "semantic_code_mcp.server",
    "semantic_code_mcp.services",
    "semantic_code_mcp.discovery | semantic_code_mcp.chunkers | semantic_code_mcp.embedding | semantic_code_mcp.storage",
    "semantic_code_mcp.config | semantic_code_mcp.logging",
    "semantic_code_mcp.domain",
]

[[tool.importlinter.contracts]]
name = "MCP stays at the edge"
type = "forbidden"
# A service or a part that imported mcp would tie the core to one SDK's version,
# as mcp 2.x's renames showed
source_modules = [
    "semantic_code_mcp.services",
    "semantic_code_mcp.discovery",
    "semantic_code_mcp.chunkers",
    "semantic_code_mcp.embedding",
    "semantic_code_mcp.storage",
    "semantic_code_mcp.domain",
    "semantic_code_mcp.config",
]
forbidden_modules = ["mcp"]

[[tool.importlinter.contracts]]
name = "LanceDB and its write lock stay in the store"
type = "forbidden"
# Replacing the vector database, or how its writers keep out of each other's way,
# touches one part
source_modules = [
    "semantic_code_mcp.app",
    "semantic_code_mcp.cli",
    "semantic_code_mcp.__main__",
    "semantic_code_mcp.server",
    "semantic_code_mcp.services",
    "semantic_code_mcp.discovery",
    "semantic_code_mcp.chunkers",
    "semantic_code_mcp.embedding",
    "semantic_code_mcp.config",
    "semantic_code_mcp.logging",
    "semantic_code_mcp.domain",
]
forbidden_modules = ["lancedb", "lance", "pyarrow", "filelock"]
# Through the part that wraps it, a library is meant to be reached
allow_indirect_imports = true

[[tool.importlinter.contracts]]
name = "The model's libraries stay in the embedder"
type = "forbidden"
# Replacing the model's library touches one part
source_modules = [
    "semantic_code_mcp.app",
    "semantic_code_mcp.cli",
    "semantic_code_mcp.__main__",
    "semantic_code_mcp.server",
    "semantic_code_mcp.services",
    "semantic_code_mcp.discovery",
    "semantic_code_mcp.chunkers",
    "semantic_code_mcp.storage",
    "semantic_code_mcp.config",
    "semantic_code_mcp.logging",
    "semantic_code_mcp.domain",
]
forbidden_modules = ["onnxruntime", "tokenizers", "huggingface_hub"]
# Through the part that wraps it, a library is meant to be reached
allow_indirect_imports = true

[[tool.importlinter.contracts]]
name = "tree-sitter stays in the chunkers"
type = "forbidden"
# A new grammar or parser touches one part
source_modules = [
    "semantic_code_mcp.app",
    "semantic_code_mcp.cli",
    "semantic_code_mcp.__main__",
    "semantic_code_mcp.server",
    "semantic_code_mcp.services",
    "semantic_code_mcp.discovery",
    "semantic_code_mcp.embedding",
    "semantic_code_mcp.storage",
    "semantic_code_mcp.config",
    "semantic_code_mcp.logging",
    "semantic_code_mcp.domain",
]
forbidden_modules = ["tree_sitter", "tree_sitter_python", "tree_sitter_rust", "tree_sitter_markdown"]
# Through the part that wraps it, a library is meant to be reached
allow_indirect_imports = true

[[tool.importlinter.contracts]]
name = "The domain is pure"
type = "forbidden"
# Models and interfaces import pydantic, the standard library and numpy's array type
# for vectors alone
source_modules = ["semantic_code_mcp.domain"]
forbidden_modules = [
    "structlog",
    "pydantic_settings",
    "mcp",
    "lancedb",
    "lance",
    "pyarrow",
    "onnxruntime",
    "tokenizers",
    "huggingface_hub",
    "tree_sitter",
]

[tool.vulture]
paths = ["src", "evals", "tests", "scripts"]
# The tools' answers: every field is read by the client from the JSON, never by name here
exclude = ["src/semantic_code_mcp/server/responses.py"]
min_confidence = 60
# Called through what they are decorated as, never by name in this code
ignore_decorators = ["@override", "@model_validator", "@field_validator", "@pytest.fixture", "@property"]
ignore_names = [
    # Pydantic's own setting, and the class a validator classmethod is handed
    "model_config",
    "cls",
    # Compared as part of a whole model, never read by name: an answer, a machine, what a
    # schema version stored
    "symbol",
    "logical_cores",
    "python",
    "columns",
    "search_texts",
    # Kept in an agents run's results, to read a session's cost by hand
    "cache_creation_tokens",
    # The recorders of what each version made, which the version tests compare: run by hand
    "record_chunks",
    "record_vectors",
    "record_schema",
]
